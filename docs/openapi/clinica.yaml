openapi: 3.0.3
info:
  title: API da Clínica Veterinária (A3 – SDM)
  version: 1.0.0
  description: 'API REST **privada** do sistema de gestão da clínica veterinária (projeto acadêmico).


    * Autenticação: `POST /api/auth/login` devolve um JWT; use **Authorize** com `Bearer <token>`.

    * Erros seguem sempre `{"erro": {"codigo", "mensagem", "detalhes"}}`.

    * Exclusão é **lógica** (DELETE inativa); listagens devolvem arrays e aceitam `limite`/`offset`.

    * Dados e integrações governamentais são **fictícios/simulados**.'
servers:
- url: http://localhost:5000
  description: Execução local
tags:
- name: Sistema
  description: Saúde e indicadores.
- name: Autenticação
  description: Login com hash + código de confirmação; JWT revogável.
- name: Veterinários
  description: Profissionais com acesso ao sistema.
- name: Endereços e CEP
  description: Endereços e consumo do ViaCEP.
- name: Tutores
  description: Responsáveis pelos animais.
- name: Espécies e raças
  description: Catálogos.
- name: Animais
  description: Pacientes.
- name: Microchip
  description: Vínculo e histórico do microchip RFID.
- name: Consultas
  description: Histórico clínico.
- name: Vacinas
  description: Vacinação; a antirrábica é comunicada obrigatoriamente ao governo.
- name: Integração com o governo
  description: Controle de PENDENTE → ENVIADA → CONFIRMADA | FALHA, reenvio e idempotência.
- name: Demonstração
  description: Apoio à apresentação (somente desenvolvimento).
paths:
  /api/status:
    get:
      tags:
      - Sistema
      summary: Saúde da API, do banco e do governo
      security: []
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /api/resumo:
    get:
      tags:
      - Sistema
      summary: Indicadores do painel
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoPainel'
        '401':
          $ref: '#/components/responses/Erro401'
  /api/auth/login:
    post:
      tags:
      - Autenticação
      summary: Login do veterinário
      description: Gera um JWT revogável. Bloqueia veterinário **inativo** e **sem senha confirmada**. Credenciais
        erradas devolvem sempre a mesma mensagem (não revela se o e-mail existe); o motivo do bloqueio só aparece
        a quem acertou a senha.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: ana.souza@clinicavet.example
              senha: Senha@123
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResposta'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '422':
          $ref: '#/components/responses/Erro422'
  /api/auth/logout:
    post:
      tags:
      - Autenticação
      summary: Encerra (revoga) a sessão atual
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/Erro401'
  /api/auth/me:
    get:
      tags:
      - Autenticação
      summary: Dados do veterinário autenticado
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veterinario'
        '401':
          $ref: '#/components/responses/Erro401'
  /api/auth/confirmar-senha:
    post:
      tags:
      - Autenticação
      summary: Confirma a senha com o código de 6 dígitos
      description: O código é guardado como HMAC, expira e tem limite de tentativas (429 ao exceder).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarSenha'
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '400':
          $ref: '#/components/responses/Erro400'
        '422':
          $ref: '#/components/responses/Erro422'
        '429':
          $ref: '#/components/responses/Erro429'
  /api/auth/reenviar-codigo:
    post:
      tags:
      - Autenticação
      summary: Reenvia o código de confirmação (e-mail simulado)
      description: Resposta sempre igual, exista ou não o e-mail. O e-mail simulado é gravado em `data/emails_simulado.log`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailEntrada'
      responses:
        '202':
          description: Aceito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '400':
          $ref: '#/components/responses/Erro400'
        '422':
          $ref: '#/components/responses/Erro422'
  /api/veterinarios:
    get:
      tags:
      - Veterinários
      summary: Listar veterinário
      parameters:
      - &id003
        name: situacao
        in: query
        schema:
          type: string
          enum:
          - ATIVO
          - INATIVO
        description: Filtra por situação.
      - &id004
        name: q
        in: query
        schema: &id002
          type: string
        description: Busca por texto.
      - &id005
        name: limite
        in: query
        schema:
          type: integer
          default: 100
          maximum: 500
        description: Itens por página.
      - &id006
        name: offset
        in: query
        schema:
          type: integer
          default: 0
        description: Deslocamento.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Veterinario'
        '401':
          $ref: '#/components/responses/Erro401'
    post:
      tags:
      - Veterinários
      summary: Cadastrar veterinário
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeterinarioNovo'
      responses:
        '201':
          description: Criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veterinario'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '409':
          $ref: '#/components/responses/Erro409'
        '422':
          $ref: '#/components/responses/Erro422'
  /api/veterinarios/{id}:
    get:
      tags:
      - Veterinários
      summary: Consultar veterinário
      parameters:
      - name: id
        in: path
        required: true
        schema: &id001
          type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veterinario'
        '401':
          $ref: '#/components/responses/Erro401'
        '404':
          $ref: '#/components/responses/Erro404'
    put:
      tags:
      - Veterinários
      summary: Alterar veterinário
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeterinarioNovo'
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Veterinario'
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '404':
          $ref: '#/components/responses/Erro404'
        '409':
          $ref: '#/components/responses/Erro409'
        '422':
          $ref: '#/components/responses/Erro422'
    delete:
      tags:
      - Veterinários
      summary: Inativar veterinário (exclusão lógica)
      description: 'Nunca apaga fisicamente: o histórico clínico e a integridade referencial são preservados.'
      parameters:
      - name: id
