components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: object
          properties:
            codigo: *id002
            mensagem: *id002
            detalhes:
              type: object
              additionalProperties: true
          required:
          - codigo
          - mensagem
      required:
      - erro
      description: Formato único de erro de toda a API.
    Login:
      type: object
      properties:
        email:
          type: string
          example: ana.souza@clinicavet.example
        senha:
          type: string
          example: Senha@123
